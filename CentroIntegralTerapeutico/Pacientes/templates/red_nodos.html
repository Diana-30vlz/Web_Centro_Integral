<canvas id="hmNet"></canvas>
<div class="hm-orbs">
    <span class="hm-orb a"></span>
    <span class="hm-orb b"></span>
    <span class="hm-orb c"></span>
</div>
<script>
(function() {
    const canvas = document.getElementById('hmNet');
    if (!canvas || canvas.dataset.ready) return;
    canvas.dataset.ready = '1';
    const ctx = canvas.getContext('2d');
    const nodes = [];
    const count = 120;
    const linkDist = 175;

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }

    function makeNodes() {
        nodes.length = 0;
        for (let i = 0; i < count; i += 1) {
            nodes.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: (Math.random() - 0.5) * 0.35,
                vy: (Math.random() - 0.5) * 0.35
            });
        }
    }

    function tick() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#d8eee8';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < nodes.length; i += 1) {
            const a = nodes[i];
            a.x += a.vx;
            a.y += a.vy;
            if (a.x < 0 || a.x > canvas.width) a.vx *= -1;
            if (a.y < 0 || a.y > canvas.height) a.vy *= -1;
            ctx.beginPath();
            ctx.arc(a.x, a.y, 2.9, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(12, 61, 44, 0.78)';
            ctx.fill();
            for (let j = i + 1; j < nodes.length; j += 1) {
                const b = nodes[j];
                const dx = a.x - b.x;
                const dy = a.y - b.y;
                const dist = Math.hypot(dx, dy);
                if (dist < linkDist) {
                    ctx.strokeStyle = 'rgba(15, 127, 118,' + (1 - dist / linkDist) * 0.7 + ')';
                    ctx.lineWidth = 1.35;
                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.stroke();
                }
            }
        }
        requestAnimationFrame(tick);
    }

    resize();
    makeNodes();
    tick();
    window.addEventListener('resize', function() {
        resize();
        makeNodes();
    });
})();
</script>
