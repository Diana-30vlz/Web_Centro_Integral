{% extends "BaseSinInicio.html" %}
{% load static %}

{% block title %}Crear Receta{% endblock %}

{% block content %}
<div class="container my-5">
    <h1 class="mb-4"><i class="bi bi-file-earmark-medical"></i> Crear Receta para {{ paciente.nombre }} {{ paciente.apellido_paterno }}</h1>
    
    <a href="#" onclick="history.back()" class="btn btn-secondary mt-3">
        <i class="bi bi-arrow-left-circle"></i> Regresar a la página anterior
    </a>

    <form method="post" class="card p-4 mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-bold"><i class="bi bi-card-text"></i> Diagnóstico</label>
            {{ form.diagnostico }}
        </div>

        <hr>
        
        <div class="row">
            <h5 class="mb-3"><i class="bi bi-heart-pulse"></i> Signos Vitales</h5>
            <div class="col-md-4 col-lg-2">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-rulers"></i> Peso (kg)</label>
                    <input type="number" step="0.01" name="peso" value="{{ paciente.peso|default:'' }}" class="form-control" id="id_peso">
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-arrows-vertical"></i> Estatura (cm)</label>
                    <input type="number" step="0.01" name="talla" value="{{ paciente.talla|default:'' }}" class="form-control" id="id_talla">
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-calendar-event"></i> Edad (años)</label>
                    <input type="number" name="edad" value="{{ paciente.edad|default:'' }}" class="form-control" id="id_edad">
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-activity"></i> T/A</label>
                    <input type="text" name="ta" class="form-control">
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-heart"></i> F.C.</label>
                    <input type="number" name="fc" class="form-control">
                </div>
            </div>
            <div class="col-md-4 col-lg-2">
                <div class="mb-3">
                    <label class="form-label"><i class="bi bi-lungs"></i> SAT. O2</label>
                    <input type="number" name="sat_o2" class="form-control">
                </div>
            </div>
        </div>
        
        <button type="submit" class="btn btn-success mt-3">
            <i class="bi bi-check-circle"></i> Guardar Receta
        </button>
    </form>
</div>
{% endblock %}
